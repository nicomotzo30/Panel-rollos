<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Smart TV: fuerza ancho fijo de 1920px y el TV escala todo proporcionalmente -->
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Panel de Producción — Rollos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:         #0f1117;
    --surface:    #161a24;
    --border:     #222840;
    --green:      #18c95d;
    --green-dim:  #071a0f;
    --red:        #e53935;
    --red-dim:    #1a0707;
    --text:       #eef0f8;
    --muted:      #4a5270;
    --accent:     #3d7fff;
    --cyan:       #00c8d4;
    --cyan-dim:   #031518;
  }

  html, body {
    width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Barlow',sans-serif;
    overflow:hidden;
  }

  /* ══ ROOT LAYOUT ══ */
  .root {
    display:grid;
    grid-template-rows: 56px auto 1fr auto 44px;
    grid-template-columns: 1fr 1fr;
    height:100vh;
    padding:10px 12px;
    gap:8px;
  }

  /* ══ HEADER ══ */
  header {
    grid-column: 1 / -1;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid var(--border);
    padding-bottom:8px;
  }

  .header-left { display:flex; align-items:baseline; gap:14px; }

  .brand {
    font-family:'Barlow Condensed',sans-serif;
    font-size:26px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
  }

  .tag {
    font-family:'Barlow Condensed',sans-serif;
    font-size:12px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
    color:var(--muted); border:1px solid var(--border); padding:2px 10px; border-radius:2px;
  }

  .header-right { display:flex; align-items:center; gap:24px; }

  .header-stats {
    display:flex; align-items:center; gap:16px;
    border-right:1px solid var(--border); padding-right:20px;
  }
  .hstat { display:flex; align-items:baseline; gap:5px; }
  .hstat-lbl { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .hstat-val { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:800; }
  .hstat-val.g { color:var(--green); }
  .hstat-val.c { color:var(--cyan); }
  .hstat-val.r { color:var(--red); }

  .clock {
    font-family:'Barlow Condensed',sans-serif;
    font-size:34px; font-weight:700; letter-spacing:2px; line-height:1; text-align:right;
  }
  .date { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); text-align:right; }

  .live-badge {
    display:flex; align-items:center; gap:7px;
    font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); font-weight:600;
  }
  .live-dot {
    width:8px; height:8px; border-radius:50%;
    background:var(--green); box-shadow:0 0 8px var(--green);
    animation:blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  /* ══ REBOBINADORAS — fila 2, ancho total ══ */
  .left-col {
    grid-column: 1 / -1;
    grid-row: 2;
    display:flex; flex-direction:column; gap:6px;
  }

  /* ══ MESAS + STATS — fila 3, columna izquierda ══ */
  .bottom-row {
    grid-column: 1;
    grid-row: 3;
    display:flex; flex-direction:column; gap:6px;
    min-height:0;
  }

  /* ══ PLAN — fila 3, columna derecha ══ */
  .right-col {
    grid-column: 2;
    grid-row: 3;
    display:flex; flex-direction:column; gap:8px;
    min-height:0;
  }

  /* ══ SECTION ══ */
  .section {
    display:flex; flex-direction:column; gap:5px;
  }

  .section-label {
    font-family:'Barlow Condensed',sans-serif;
    font-size:13px; font-weight:700; letter-spacing:4px;
    text-transform:uppercase; color:var(--muted);
    display:flex; align-items:center; gap:8px;
    flex-shrink:0;
  }
  .section-label::after {
    content:''; flex:1; height:1px; background:var(--border);
  }

  /* ══ ROW CARD ══ */
  .row-card {
    display:grid;
    grid-template-columns: 110px minmax(0, 1fr) 160px 140px 100px;
    align-items:center;
    gap:0;
    border-radius:4px;
    border:1px solid var(--border);
    background:var(--surface);
    overflow:hidden;
    position:relative;
    height:65px;
    flex-shrink:0;
    transition:border-color .3s, background .3s;
  }

  /* left accent bar */
  .row-card::before {
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--border);
    transition:background .3s;
  }

  /* ESTADO BINARIO: verde = activa | rojo = todo lo demás */
  .row-card.active       { border-color:var(--green); background:var(--green-dim); }
  .row-card.inactive,
  .row-card.paused       { border-color:var(--red);   background:var(--red-dim); }
  .row-card.mesa-active  { border-color:var(--cyan);  background:var(--cyan-dim); }

  .row-card.active::before      { background:var(--green); }
  .row-card.inactive::before,
  .row-card.paused::before      { background:var(--red); }
  .row-card.mesa-active::before { background:var(--cyan); }

  /* ── cell: machine id ── */
  .cell-id {
    padding:0 8px 0 12px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:40px; font-weight:700; letter-spacing:2px;
    text-transform:uppercase; color:var(--muted);
    white-space:nowrap;
  }

  /* ── cell: product name ── */
  .cell-product {
    padding:0 12px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:45px; font-weight:800; line-height:1.1;
    text-transform:uppercase; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border-left:1px solid rgba(34,40,64,.6);
  }
  .row-card.inactive .cell-product,
  .row-card.paused   .cell-product { color:rgba(238,240,248,.25); font-size:30px; }

  /* ── cell: operario + hora ── */
  .cell-operator {
    padding:0 12px;
    border-left:1px solid rgba(34,40,64,.6);
    display:flex; flex-direction:column; justify-content:center; gap:1px;
  }
  .op-name {
    font-size:23px; font-weight:600; color:rgba(238,240,248,.6);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .op-time {
    font-family:'Barlow Condensed',sans-serif;
    font-size:12px; color:var(--muted); letter-spacing:1px;
  }
  .stop-reason {
    font-family:'Barlow Condensed',sans-serif;
    font-size:23px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    color:var(--red); opacity:.85;
  }

  /* ── cell: produccion ── */
  .cell-metric {
    padding:0 12px;
    border-left:1px solid rgba(34,40,64,.6);
    display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  }
  .metric-num {
    font-family:'Barlow Condensed',sans-serif;
    font-size:26px; font-weight:900; line-height:1; letter-spacing:1px;
  }
  .row-card.active      .metric-num { color:var(--green); }
  .row-card.mesa-active .metric-num { color:var(--cyan); }
  .row-card.inactive    .metric-num,
  .row-card.paused      .metric-num { color:rgba(238,240,248,.15); }
  .metric-label {
    font-size:9px; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); font-weight:600; text-align:right;
  }

  /* ── cell: rendimiento ── */
  .cell-rend {
    padding:0 12px;
    border-left:1px solid rgba(34,40,64,.6);
    display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:2px;
  }
  .rend-badge {
    display:inline-flex; align-items:center;
    padding:3px 10px; border-radius:3px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:18px; font-weight:800; letter-spacing:1px;
  }
  .rend-badge.high { background:rgba(24,201,93,.15);  color:var(--green); }
  .rend-badge.mid  { background:rgba(245,166,35,.15); color:#f5a623; }
  .rend-badge.low  { background:rgba(229,57,53,.15);  color:var(--red); }
  .rend-badge.none { background:rgba(255,255,255,.04); color:var(--muted); }
  .rend-label {
    font-size:9px; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); font-weight:600; text-align:right;
  }

  /* ══ PANEL BOX ══ */
  .panel-box {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:5px;
    padding:14px 14px 12px;
    flex:1; overflow:hidden;
    display:flex; flex-direction:column;
  }

  .panel-title {
    font-family:'Barlow Condensed',sans-serif;
    font-size:13px; font-weight:700; letter-spacing:4px;
    text-transform:uppercase; color:var(--muted);
    margin-bottom:10px; padding-bottom:8px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }

  .plan-list { display:flex; flex-direction:column; flex:1; overflow:hidden; }

  .plan-row {
    display:flex; flex-direction:column;
    padding:9px 0;
    border-bottom:1px solid rgba(34,40,64,.8);
    flex-shrink:0;
  }
  .plan-row:last-child { border-bottom:none; }

  .plan-product {
    font-family:'Barlow Condensed',sans-serif;
    font-size:40px; font-weight:800; text-transform:uppercase;
    line-height:1.15; color:var(--text);
  }

  .plan-fecha {
    font-size:25px; font-weight:600; letter-spacing:1px;
    color:var(--accent); text-transform:uppercase; margin-top:2px;
  }

  /* ══ FOOTER ══ */
  footer {
    grid-row:5;
    grid-column:1 / -1;
    display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid var(--border); padding-top:8px;
  }

  .footer-stat { display:flex; align-items:baseline; gap:6px; }
  .footer-stat-lbl { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .footer-stat-val { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:800; color:var(--green); }
  .footer-right { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:600; }

  @keyframes numflash { 0%{opacity:.3} 100%{opacity:1} }
  .flash { animation:numflash .35s ease-out; }
#rebobList, #mesasList { display:flex; flex-direction:column; gap:5px; }
  .stop-reason { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .row-card.unknown { border-color:#f5a623; background:#211b0b; }
  .row-card.unknown::before { background:#f5a623; }
  .row-card.unknown .cell-product { color:#f5a623; font-size:30px; }
  .row-card.unknown .stop-reason { color:#f5a623; font-size:16px; }
  #dataWarnings { grid-column:1 / -1; grid-row:4; color:#f5a623; font-size:14px; max-height:38px; overflow:auto; }
  .plan-list { overflow-y:auto; }
  .bottom-row { overflow-y:auto; }
</style>
</head>
<body>
<div class="root">

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <div class="brand" id="companyName">Alpac SRL</div>
      <div class="tag">Rollos</div>
    </div>
    <div class="header-right">
      <div class="header-stats">
        <div class="hstat">
          <span class="hstat-lbl">Rebob. activas</span>
          <span class="hstat-val g" id="stRebobActive">—</span>
        </div>
        <div class="hstat">
          <span class="hstat-lbl">Mesas activas</span>
          <span class="hstat-val c" id="stMesasActive">—</span>
        </div>
        <div class="hstat">
          <span class="hstat-lbl">Inactivas</span>
          <span class="hstat-val r" id="stInactive">—</span>
        </div>
        <div class="hstat"><span class="hstat-lbl">Revisar</span><span class="hstat-val" style="color:#f5a623" id="stUnknown">—</span></div>
      </div>
      <div class="live-badge" id="connectionBadge"><div class="live-dot" id="connectionDot"></div><span id="connectionText">CARGANDO</span></div>
      <div>
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="dateDisplay">—</div>
      </div>
    </div>
  </header>

  <!-- REBOBINADORAS: ancho total -->
  <div class="left-col">
    <div class="section">
      <div class="section-label">Rebobinadoras</div>
      <div id="rebobList"><div class="plan-product">CARGANDO DATOS…</div></div>
    </div>
  </div>

  <!-- BOTTOM LEFT: mesas -->
  <div class="bottom-row">
    <div class="section">
      <div class="section-label">FC-10-05-Control de Embalaje</div>
      <div id="mesasList"></div>
    </div>
  </div>

  <!-- BOTTOM RIGHT: plan -->
  <div class="right-col">
    <div class="panel-box">
      <div class="panel-title">Plan de Producción</div>
      <div class="plan-list" id="planList"></div>
    </div>
  </div>

  <div id="dataWarnings" role="status" hidden></div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-stat">
      <span class="footer-stat-lbl">Capacidad de referencia / día</span>
      <span class="footer-stat-val" id="totalProd">—</span>
    </div>
    <div class="footer-right" id="lastUpdate">—</div>
  </footer>

</div>

<script>

function getSku(articulo) {
  if (!articulo) return null;
  const key = articulo.trim().toUpperCase();
  if (DESC_A_SKU[key]) return DESC_A_SKU[key];
  return Object.prototype.hasOwnProperty.call(PRODUCTOS_RPM, key) ||
    Object.prototype.hasOwnProperty.call(PRODUCTOS_CPD, key) ? key : null;
}

// ═══════════════════════════════════════
// TABLA RPM → rollos/día (RA02, RA03)
// ═══════════════════════════════════════

function getProduccionRebob(articulo, maquinaId) {
  if (!articulo) return null;
  const sku = getSku(articulo);
  if (!sku) return null;
  if (REBOB_RPM.includes(maquinaId)) {
    const p = PRODUCTOS_RPM[sku];
    if (!p) return null;
    return { valor: Math.round(p.rpm * 60 * HORAS_JORNADA_TEORICA), unidad: "rollos / día" };
  } else {
    const p = PRODUCTOS_CPD[sku];
    if (!p) return null;
    return { valor: p.cpd, unidad: "cajas / día" };
  }
}

function rendClass(pct) {
  if (pct === null || pct === undefined) return "none";
  if (pct >= 70) return "high";
  if (pct >= 50) return "mid";
  return "low";
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function escapeHTML(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function rendimientoPorcentaje(value) {
  if (value == null || String(value).trim() === "") return null;
  const raw = String(value).trim();
  const explicitPercent = /%$/.test(raw);
  const n = Number(raw.replace(/%$/, "").trim().replace(",", "."));
  if (!Number.isFinite(n) || n < 0) return null;
  const formato = window._rendimientoFormato || RENDIMIENTO_FORMATO;
  if (!explicitPercent && !["percent", "fraction"].includes(formato)) return null;
  const factor = !explicitPercent && formato === "fraction" ? 100 : 1;
  return Math.round(n * factor);
}
function fmt(n) { return Number(n).toLocaleString("es-AR"); }

function buildRow(m, tipo) {
  const esMesa   = tipo === "mesa";
  const esActiva = m.estado === "active";

  // Estado CSS: binario verde/rojo, excepto mesas activas que usan cyan
  let rowClass;
  if (esMesa && esActiva) {
    rowClass = "row-card mesa-active";
  } else if (esActiva) {
    rowClass = "row-card active";
  } else {
    // paused e inactive → ambos rojo
    rowClass = m.estado === "unknown" ? "row-card unknown" : "row-card inactive";
  }

  const nombreProducto = m.estado === "unknown" ? "SIN DATOS" :
    (esActiva ? (m.articulo || "PRODUCTO NO INFORMADO") : "INACTIVA");

  let operadorHTML = "";
  if (esActiva) {
    operadorHTML = `<div class="op-name">${escapeHTML(m.operario||"—")}</div>`;
    if (!esMesa && m.horaInicio) operadorHTML += `<div class="op-time">Inicio: ${escapeHTML(m.horaInicio)}</div>`;
  } else {
    // Motivo de parada siempre en rojo
    operadorHTML = `<div class="stop-reason">${escapeHTML(m.estado === "unknown" ? (m.motivoParada || "Estado no disponible") : (m.motivoParada||"Inactiva"))}</div>`;
  }

  let metricaHTML = "";
  if (!esMesa) {
    const prod = esActiva ? getProduccionRebob(m.articulo, m.id) : null;
    metricaHTML = prod
      ? `<div class="metric-num">${fmt(prod.valor)}</div><div class="metric-label">${prod.unidad}</div>`
      : `<div class="metric-num" style="font-size:18px;opacity:.2">—</div><div class="metric-label">sin cálculo</div>`;
  }

  let rendHTML = "";
  if (!esMesa) {
    const rendRaw = esActiva ? rendimientoPorcentaje(m.rendimiento) : null;
    const rc = rendClass(rendRaw);
    rendHTML = rendRaw != null
      ? `<div class="rend-badge ${rc}">${rendRaw}%</div><div class="rend-label">rend. ${escapeHTML(window._mesRef||'')}</div>`
      : `<div class="rend-badge none">—</div><div class="rend-label">sin dato</div>`;
  }

  const gridStyle = esMesa ? 'style="grid-template-columns: 90px minmax(0, 1fr) 180px;"' : '';

  return `
    <div class="${rowClass}" ${gridStyle}>
      <div class="cell-id">${escapeHTML(m.id)}</div>
      <div class="cell-product">${escapeHTML(nombreProducto)}</div>
      <div class="cell-operator">${operadorHTML}</div>
      ${!esMesa ? `<div class="cell-metric">${metricaHTML}</div>` : ''}
      ${!esMesa ? `<div class="cell-rend">${rendHTML}</div>` : ''}
    </div>
  `;
}

function renderAll(data) {
  document.getElementById("companyName").textContent = data.empresa || COMPANY_NAME;
  window._mesRef = data.mesRef || "";
  window._rendimientoFormato = data.rendimientoFormato || RENDIMIENTO_FORMATO;

  let nRebobActive=0, nMesasActive=0, nInactive=0;

  // Rebobinadoras
  const rebobList = document.getElementById("rebobList");
  rebobList.innerHTML = (data.rebobinadoras || []).map(m => {
    if (m.estado === "active") nRebobActive++;
    else if (m.estado !== "unknown") nInactive++;
    return buildRow(m, "rebob");
  }).join("");

  // Mesas
  const mesasList = document.getElementById("mesasList");
  mesasList.innerHTML = (data.mesas || []).map(m => {
    if (m.estado === "active") nMesasActive++;
    else if (m.estado !== "unknown") nInactive++;

    if (m.estado === "active" && m.articulo && m.articulo.includes("||")) {
      const productos = m.articulo.split("||").map(p => p.trim()).filter(Boolean);
      return productos.map((prod, i) => {
        const mRow = { ...m, articulo: prod, id: i === 0 ? m.id : "" };
        return buildRow(mRow, "mesa");
      }).join("");
    }
    return buildRow(m, "mesa");
  }).join("");

  // Stats header (simplificado: Activas + Inactivas)
  document.getElementById("stRebobActive").textContent = nRebobActive;
  document.getElementById("stMesasActive").textContent = nMesasActive;
  document.getElementById("stInactive").textContent    = nInactive;

  const unknownCount = data.rebobinadoras.concat(data.mesas).filter(m => m.estado === "unknown").length;
  document.getElementById("stUnknown").textContent = unknownCount;
  const warnings = document.getElementById("dataWarnings");
  warnings.textContent = (data.alertas || []).join(" · ");
  warnings.hidden = !warnings.textContent;

  // Rollos y cajas tienen unidades distintas: nunca se suman entre sí.
  const totals = {};
  let missing = 0;
  data.rebobinadoras.forEach(m => {
    if (m.estado !== "active") return;
    const p = getProduccionRebob(m.articulo, m.id);
    if (p) totals[p.unidad] = (totals[p.unidad] || 0) + p.valor;
    else missing++;
  });
  const parts = Object.keys(totals).map(unit => fmt(totals[unit]) + " " + unit);
  if (unknownCount) parts.push("Parcial: hay estados sin confirmar");
  if (missing) parts.push(missing + " sin referencia");
  document.getElementById("totalProd").textContent = parts.join(" · ") || "—";

  // Plan
  const planList = document.getElementById("planList");
  planList.innerHTML = "";
  (data.plan||[]).forEach(p => {
    const row = document.createElement("div");
    row.className = "plan-row";
    row.innerHTML = `
      <div class="plan-product">${escapeHTML(p.producto)}</div>
      <div class="plan-fecha">${escapeHTML(p.fecha||"")}</div>
    `;
    planList.appendChild(row);
  });

  const now = new Date();
  document.getElementById("lastUpdate").textContent =
    `Última actualización: ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
}

// ═══════════════════════════════════════
// RELOJ
// ═══════════════════════════════════════
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const days   = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const months = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  document.getElementById("dateDisplay").textContent =
    `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
}

// ═══════════════════════════════════════
// FETCH
// ═══════════════════════════════════════
let lastGoodData = null;
let lastSuccess = null;
let loading = false;

function validateData(data) {
  if (!data || typeof data !== "object" || data.error ||
      !Array.isArray(data.rebobinadoras) || !data.rebobinadoras.length ||
      !Array.isArray(data.mesas) || (data.plan != null && !Array.isArray(data.plan))) {
    throw new Error("Respuesta de la planilla incompleta o inválida");
  }
  const normalize = (list) => {
    const ids = new Set();
    return list.map(m => {
      if (!m || typeof m.id !== "string" || !m.id.trim()) throw new Error("Máquina sin identificador");
      const id = m.id.trim().toUpperCase();
      if (ids.has(id)) throw new Error("Máquina repetida: " + id);
      ids.add(id);
      ["articulo", "operario", "horaInicio", "motivoParada"].forEach(key => {
        if (m[key] != null && typeof m[key] !== "string") throw new Error("Campo inválido: " + key);
      });
      const state = String(m.estado || "").trim().toLowerCase();
      const estado = ["active", "inactive", "paused", "unknown"].includes(state) ? state : "unknown";
      return Object.assign({}, m, { id, estado });
    });
  };
  if (data.alertas != null && (!Array.isArray(data.alertas) || data.alertas.some(a => typeof a !== "string"))) {
    throw new Error("Avisos del servidor inválidos");
  }
  const plan = data.plan || [];
  plan.forEach(p => {
    if (!p || typeof p.producto !== "string" || (p.fecha != null && typeof p.fecha !== "string")) {
      throw new Error("Plan de producción inválido");
    }
  });
  return Object.assign({}, data, { rebobinadoras: normalize(data.rebobinadoras), mesas: normalize(data.mesas), plan });
}

function connectionStatus(ok, text) {
  document.getElementById("connectionText").textContent = text;
  const dot = document.getElementById("connectionDot");
  dot.style.background = ok ? "var(--green)" : "#f5a623";
  dot.style.boxShadow = "none";
  dot.style.animation = ok ? "" : "none";
}

function showUnavailable(error) {
  connectionStatus(false, "SIN DATOS ACTUALES");
  // Conservar solo los identificadores para evitar presentar estados viejos como actuales.
  [ ["rebobList", "rebobinadoras", "rebob"], ["mesasList", "mesas", "mesa"] ].forEach(item => {
    const list = lastGoodData ? lastGoodData[item[1]] : [];
    document.getElementById(item[0]).innerHTML = list.length
      ? list.map(m => buildRow({ id: m.id, estado: "unknown" }, item[2])).join("")
      : '<div class="plan-product">SIN DATOS ACTUALES</div>';
  });
  ["stRebobActive", "stMesasActive", "stInactive", "stUnknown", "totalProd"].forEach(id => {
    document.getElementById(id).textContent = "—";
  });
  document.getElementById("planList").textContent = "Plan no disponible";
  document.getElementById("dataWarnings").hidden = true;
  document.getElementById("lastUpdate").textContent = "Error de conexión o datos. " +
    (lastSuccess ? "Última lectura válida: " + lastSuccess.toLocaleString("es-AR") : "Sin lectura válida") +
    " · Reintentando automáticamente";
  console.error("No se pudo actualizar el panel:", error);
}

async function fetchAndRender() {
  if (loading) return;
  loading = true;
  let timer;
  const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
  try {
    const timeout = new Promise((resolve, reject) => {
      timer = setTimeout(() => {
        if (controller) controller.abort();
        reject(new Error("Tiempo de espera agotado"));
      }, REQUEST_TIMEOUT_MS);
    });
    const options = { cache: "no-store" };
    if (controller) options.signal = controller.signal;
    const request = fetch(SHEET_URL + (SHEET_URL.includes("?") ? "&" : "?") + "t=" + Date.now(), options)
      .then(response => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      });
    const data = validateData(await Promise.race([request, timeout]));
    renderAll(data);
    lastGoodData = data;
    lastSuccess = new Date();
    const unknown = data.rebobinadoras.concat(data.mesas).some(m => m.estado === "unknown");
    const hasWarnings = unknown || (data.alertas && data.alertas.length > 0);
    connectionStatus(!hasWarnings, hasWarnings ? "REVISAR AVISOS" : "CONECTADO");
  } catch (error) {
    showUnavailable(error);
  } finally {
    clearTimeout(timer);
    loading = false;
    setTimeout(fetchAndRender, REFRESH_MS);
  }
}

updateClock();
setInterval(updateClock, 30000);
connectionStatus(false, "CARGANDO");
fetchAndRender();
</script>
